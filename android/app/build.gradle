// StockLink Android app: a Trusted Web Activity that opens the StockLink website full screen.
// The address comes from APP_URL (GitHub repository variable), e.g. https://stocklink-xxxx.onrender.com
plugins { id 'com.android.application' }

def appUrl = (System.getenv('APP_URL') ?: 'https://example.com').trim().replaceAll('/+$', '')
def appHost = new URI(appUrl).host
// Keep only plain letters/digits/symbols: a password copied on Windows can carry an invisible extra character.
def ksPass = (System.getenv('KEYSTORE_PASSWORD') ?: '').replaceAll('[^\\x21-\\x7E]', '')
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.stocklink.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stocklink.app'
        minSdk 21
        targetSdk 35
        versionCode buildNo
        versionName "1.0.${buildNo}"
        manifestPlaceholders = [hostName: appHost, launchUrl: appUrl + '/?source=app']
        resValue 'string', 'appName', 'StockLink'
        // Quotes must be escaped (\") or Android strips them and the website link check fails (address bar shows).
        resValue 'string', 'asset_statements', '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"' + appUrl + '\\"}}]'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storePassword ksPass
            keyAlias 'stocklink'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    // The release build runs Android's "lint vital" check, which fails on store-policy warnings
    // (e.g. target SDK age). This APK is installed directly, not via Play, so do not let lint block it.
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
